name: Booster library quality
description: Locked baseline before Core, followed by exact candidate-host checks on one Linux runner.
inputs:
  php-version:
    description: One supported matrix member (8.2 or 8.5); the caller must run both.
    required: true
  booster-sha:
    description: Full immutable candidate Booster commit; not released or installed certification.
    required: true
runs:
  using: composite
  steps:
    - name: Reject privileged pull_request_target callers
      if: ${{ github.event_name == 'pull_request_target' }}
      shell: bash
      run: exit 1

    - name: Validate recipe inputs
      shell: bash
      env:
        RAN_PHP_VERSION: ${{ inputs.php-version }}
        RAN_BOOSTER_HOST_SHA: ${{ inputs.booster-sha }}
      run: |
        set -euo pipefail
        case "$RAN_PHP_VERSION" in 8.2|8.5) ;; *) exit 1 ;; esac
        [[ "$RAN_BOOSTER_HOST_SHA" =~ ^[0-9a-f]{40}$ ]]

    - name: Check out exact package revision
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        path: package
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Verify exact source revision and locked manifests
      env:
        RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      working-directory: package
      shell: bash
      run: |
        set -euo pipefail
        test -n "$RAN_EXPECTED_SHA"
        test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"
        test -f composer.json
        test -f composer.lock

    - name: Set up PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: zip
        coverage: none
        tools: composer:v2

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24.11.0'
        check-latest: false

    - name: Verify exact Node.js version
      shell: bash
      run: test "$(node --version)" = v24.11.0

    - name: Validate Composer configuration
      working-directory: package
      shell: bash
      run: composer validate --strict --no-check-publish --no-check-all

    - name: Install locked Composer dependencies
      working-directory: package
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Run independent baseline before Core exists
      env:
        RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        RAN_RECIPE_PATH: ${{ github.action_path }}
        RAN_CI_PHASE_STATE: ${{ runner.temp }}/booster-library-phase-${{ inputs.php-version }}
      working-directory: package
      shell: bash
      run: bash "$RAN_RECIPE_PATH/ci-quality-phase.sh" baseline

    - name: Check out candidate Booster host
      # Retain the exact candidate-only API12/V3 tuple; not installed/released certification.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: RocketsAreNostalgic/ran-booster
        ref: ${{ inputs.booster-sha }}
        persist-credentials: false
        path: booster

    - name: Run candidate-host quality aggregate
      env:
        RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        RAN_BOOSTER_HOST_SHA: ${{ inputs.booster-sha }}
        RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/booster
        RAN_RECIPE_PATH: ${{ github.action_path }}
        RAN_CI_PHASE_STATE: ${{ runner.temp }}/booster-library-phase-${{ inputs.php-version }}
      working-directory: package
      shell: bash
      run: bash "$RAN_RECIPE_PATH/ci-quality-phase.sh" host
