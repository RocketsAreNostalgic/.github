name: RAN Release Liveness Observer

on:
  workflow_call:
    inputs:
      grace_minutes:
        description: Minutes after the merged release proposal before an unresolved candidate is stranded.
        required: false
        type: number
        default: 60
      manifest_path:
        description: Repository-relative Release Please manifest path.
        required: false
        type: string
        default: .release-please-manifest.json
      release_pr_title_prefix:
        description: Exact title prefix used by the merged Release Please proposal.
        required: false
        type: string
        default: 'chore(main): release '
      active_workflow_names:
        description: Comma-separated workflow names whose active exact-candidate runs may keep publication pending.
        required: false
        type: string
        default: 'Release Please'
    outputs:
      state:
        description: Observed candidate state when the observer completes successfully.
        value: ${{ jobs.observe.outputs.state }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  observe:
    name: Observe release terminal state
    concurrency:
      group: release-liveness-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      state: ${{ steps.observe.outputs.state }}
    env:
      GH_TOKEN: ${{ github.token }}
      RAN_GRACE_MINUTES: ${{ inputs.grace_minutes }}
      RAN_MANIFEST_PATH: ${{ inputs.manifest_path }}
      RAN_RELEASE_PR_TITLE_PREFIX: ${{ inputs.release_pr_title_prefix }}
      RAN_ACTIVE_WORKFLOW_NAMES: ${{ inputs.active_workflow_names }}
    steps:
      - name: Observe current release candidate
        id: observe
        shell: bash
        run: |
          set -euo pipefail

          fail_observer() {
            local message="$1"
            {
              echo '## Release liveness: observer error'
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$message"
            exit 1
          }

          record_state() {
            local state="$1" detail="$2"
            echo "state=${state}" >> "$GITHUB_OUTPUT"
            {
              echo "## Release liveness: ${state}"
              echo
              echo "$detail"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          resolve_tag_commit() {
            local object_json="$1" object_type object_sha depth
            for depth in {1..16}; do
              object_type="$(jq -er '.object.type' <<< "$object_json")"
              object_sha="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<< "$object_json")"
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                  ;;
                *)
                  echo "::error::Unsupported Git tag object type: ${object_type}" >&2
                  return 1
                  ;;
              esac
            done
            echo '::error::Git tag indirection exceeds the supported depth.' >&2
            return 1
          }

          [[ "$RAN_GRACE_MINUTES" =~ ^[0-9]+$ ]] || fail_observer 'grace_minutes must be a non-negative integer.'
          [[ "$RAN_MANIFEST_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$RAN_MANIFEST_PATH" != *'..'* ]] \
            || fail_observer 'manifest_path contains unsupported path syntax.'
          test -n "$RAN_RELEASE_PR_TITLE_PREFIX" || fail_observer 'release_pr_title_prefix must not be empty.'
          test -n "$RAN_ACTIVE_WORKFLOW_NAMES" || fail_observer 'active_workflow_names must not be empty.'
          readonly RAN_RECONCILED_LABEL='release: reconciled'

          repository="$GITHUB_REPOSITORY"
          default_branch="$(gh api "repos/${repository}" --jq '.default_branch')"
          test -n "$default_branch" || fail_observer 'Could not resolve the default branch.'

          manifest="$(
            gh api --method GET "repos/${repository}/contents/${RAN_MANIFEST_PATH}" \
              -f ref="$default_branch" \
              --jq '.content' |
              tr -d '\n' |
              base64 --decode
          )"
          version="$(jq -er '.["."] | select(type == "string" and length > 0)' <<< "$manifest")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || fail_observer "Manifest version is not a supported Release Please version: ${version}"

          tag="v${version}"
          expected_title="${RAN_RELEASE_PR_TITLE_PREFIX}${version}"

          pull_pages="$(
            gh api --paginate --method GET \
              "repos/${repository}/pulls" \
              -f state=closed \
              -f base="$default_branch" \
              -F per_page=100 \
              --slurp
          )"
          candidates="$(
            jq -c --arg title "$expected_title" \
              '[.[][] | select(
                .merged_at != null and
                .title == $title and
                ([.labels[].name] | index("autorelease: abandoned") == null)
              )]' \
              <<< "$pull_pages"
          )"
          candidate_count="$(jq -er 'length' <<< "$candidates")"
          if [[ "$candidate_count" != 1 ]]; then
            fail_observer "Expected exactly one merged release proposal titled '${expected_title}', found ${candidate_count}."
          fi

          candidate="$(jq -c '.[0]' <<< "$candidates")"
          candidate_number="$(jq -er '.number' <<< "$candidate")"
          candidate_sha="$(jq -er '.merge_commit_sha | select(test("^[0-9a-f]{40}$"))' <<< "$candidate")"
          merged_at="$(jq -er '.merged_at | select(type == "string" and length > 0)' <<< "$candidate")"
          reconciled="$(
            jq -r --arg label "$RAN_RECONCILED_LABEL" \
              '[.labels[].name] | index($label) != null' \
              <<< "$candidate"
          )"
          pending="$(
            jq -r '[.labels[].name] | index("autorelease: pending") != null' <<< "$candidate"
          )"
          tagged="$(
            jq -r '[.labels[].name] | index("autorelease: tagged") != null' <<< "$candidate"
          )"

          merged_epoch="$(date -u -d "$merged_at" +%s)"
          now_epoch="$(date -u +%s)"
          if [[ "$merged_epoch" -gt "$now_epoch" ]]; then
            fail_observer "Release proposal merge time ${merged_at} is in the future."
          fi
          age_minutes="$(( (now_epoch - merged_epoch) / 60 ))"

          active_workflow_names="$(jq -Rce 'split(",") | map(gsub("^[[:space:]]+|[[:space:]]+$"; "")) | map(select(length > 0)) | unique | select(length > 0)' <<< "$RAN_ACTIVE_WORKFLOW_NAMES")" || fail_observer 'active_workflow_names must contain at least one workflow name.'
          runs="$(gh api --paginate "repos/${repository}/actions/runs?head_sha=${candidate_sha}&per_page=100" --slurp)"
          active_runs="$(jq -c --argjson current_run_id "$GITHUB_RUN_ID" --argjson workflow_names "$active_workflow_names" '[.[].workflow_runs[] | select(.id != $current_run_id and .status != "completed" and (.name as $name | ($workflow_names | index($name)) != null)) | {id, name, event, status, html_url}]' <<< "$runs")"
          active_count="$(jq -er 'length' <<< "$active_runs")"
          active_names="$(jq -r '[.[] | "\(.name) (#\(.id), \(.status))"] | join(", ")' <<< "$active_runs")"

          release_file="$(mktemp)"
          curl_status=0
          http_status="$(
            curl --silent --show-error \
              --output "$release_file" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${repository}/releases/tags/${tag}"
          )" || curl_status=$?

          if [[ "$curl_status" -ne 0 ]]; then
            rm -f "$release_file"
            fail_observer "Published-release lookup failed at the transport layer with status ${curl_status}."
          fi

          case "$http_status" in
            200)
              release="$(cat "$release_file")"
              rm -f "$release_file"
              release_is_published="$(
                jq -r --arg tag "$tag" '.tag_name == $tag and .draft == false and .published_at != null' <<< "$release"
              )"

              if [[ "$release_is_published" != true ]]; then
                if [[ "$age_minutes" -lt "$RAN_GRACE_MINUTES" ]]; then
                  record_state \
                    pending \
                    "PR #${candidate_number} / ${tag} has a visible draft or otherwise unpublished release inside the ${RAN_GRACE_MINUTES}-minute grace window."
                  exit 0
                fi

                transitional_runs="$(gh api --paginate "repos/${repository}/actions/runs?head_sha=${candidate_sha}&per_page=100" --slurp)"
                transitional_active_runs="$(jq -c --argjson current_run_id "$GITHUB_RUN_ID" --argjson workflow_names "$active_workflow_names" '[.[].workflow_runs[] | select(.id != $current_run_id and .status != "completed" and (.name as $name | ($workflow_names | index($name)) != null)) | {id, name, event, status, html_url}]' <<< "$transitional_runs")"
                transitional_active_count="$(jq -er 'length' <<< "$transitional_active_runs")"
                if [[ "$transitional_active_count" -gt 0 ]]; then
                  transitional_active_names="$(jq -r '[.[] | "\(.name) (#\(.id), \(.status))"] | join(", ")' <<< "$transitional_active_runs")"
                  record_state \
                    pending \
                    "PR #${candidate_number} / ${tag} has a visible draft or otherwise unpublished release while release-capable automation is active: ${transitional_active_names}."
                  exit 0
                fi

                fail_observer "Release ${tag} exists but remains draft or unpublished beyond grace with no release-capable automation active."
              fi

              tag_ref="$(gh api "repos/${repository}/git/ref/tags/${tag}")"
              tag_commit="$(resolve_tag_commit "$tag_ref")"
              if [[ "$tag_commit" != "$candidate_sha" ]]; then
                fail_observer "Published tag ${tag} resolves to ${tag_commit}, not exact candidate ${candidate_sha}."
              fi
              candidate_labels="$(gh api "repos/${repository}/pulls/${candidate_number}" --jq '[.labels[].name]')"
              reconciled="$(jq -r --arg label "$RAN_RECONCILED_LABEL" 'index($label) != null' <<< "$candidate_labels")"
              pending="$(jq -r 'index("autorelease: pending") != null' <<< "$candidate_labels")"
              tagged="$(jq -r 'index("autorelease: tagged") != null' <<< "$candidate_labels")"

              if [[ "$tagged" != true || "$pending" == true ]]; then
                if [[ "$age_minutes" -lt "$RAN_GRACE_MINUTES" ]]; then
                  record_state \
                    pending \
                    "PR #${candidate_number} / ${tag} is published at exact candidate ${candidate_sha}, but Release Please labels are still transitioning inside the ${RAN_GRACE_MINUTES}-minute grace window."
                  exit 0
                fi

                transitional_runs="$(gh api --paginate "repos/${repository}/actions/runs?head_sha=${candidate_sha}&per_page=100" --slurp)"
                transitional_active_runs="$(jq -c --argjson current_run_id "$GITHUB_RUN_ID" --argjson workflow_names "$active_workflow_names" '[.[].workflow_runs[] | select(.id != $current_run_id and .status != "completed" and (.name as $name | ($workflow_names | index($name)) != null)) | {id, name, event, status, html_url}]' <<< "$transitional_runs")"
                transitional_active_count="$(jq -er 'length' <<< "$transitional_active_runs")"
                if [[ "$transitional_active_count" -gt 0 ]]; then
                  transitional_active_names="$(jq -r '[.[] | "\(.name) (#\(.id), \(.status))"] | join(", ")' <<< "$transitional_active_runs")"
                  record_state \
                    pending \
                    "PR #${candidate_number} / ${tag} is published at exact candidate ${candidate_sha}, but Release Please labels are still transitioning while release-capable automation is active: ${transitional_active_names}."
                  exit 0
                fi
                fail_observer "Published release ${tag} exists, but Release Please labels are not terminally reconciled."
              fi
              if [[ "$reconciled" == true ]]; then
                fail_observer "Published release ${tag} also carries the unpublished reconciliation marker ${RAN_RECONCILED_LABEL}."
              fi

              record_state \
                published \
                "PR #${candidate_number} / ${tag} is published at exact candidate ${candidate_sha}."
              exit 0
              ;;
            404)
              rm -f "$release_file"
              ;;
            *)
              cat "$release_file" >&2
              rm -f "$release_file"
              fail_observer "Published-release lookup for ${tag} failed with HTTP ${http_status}."
              ;;
          esac

          tag_present=false
          tag_file="$(mktemp)"
          tag_curl_status=0
          tag_http_status="$(
            curl --silent --show-error \
              --output "$tag_file" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${repository}/git/ref/tags/${tag}"
          )" || tag_curl_status=$?

          if [[ "$tag_curl_status" -ne 0 ]]; then
            rm -f "$tag_file"
            fail_observer "Tag lookup failed at the transport layer with status ${tag_curl_status}."
          fi

          case "$tag_http_status" in
            200)
              tag_ref="$(cat "$tag_file")"
              rm -f "$tag_file"
              tag_commit="$(resolve_tag_commit "$tag_ref")"
              if [[ "$tag_commit" != "$candidate_sha" ]]; then
                fail_observer "Existing tag ${tag} resolves to ${tag_commit}, not exact candidate ${candidate_sha}."
              fi
              tag_present=true
              ;;
            404)
              rm -f "$tag_file"
              ;;
            *)
              cat "$tag_file" >&2
              rm -f "$tag_file"
              fail_observer "Tag lookup for ${tag} failed with HTTP ${tag_http_status}."
              ;;
          esac

          if [[ "$tagged" == true ]]; then
            fail_observer "PR #${candidate_number} is marked autorelease: tagged, but no published release exists for ${tag}."
          fi

          if [[ "$reconciled" == true ]]; then
            if [[ "$pending" == true ]]; then
              fail_observer "PR #${candidate_number} is marked ${RAN_RECONCILED_LABEL} but still carries autorelease: pending."
            fi
            if [[ "$tag_present" == true ]]; then
              fail_observer "PR #${candidate_number} is marked ${RAN_RECONCILED_LABEL}, but exact tag ${tag} still exists without a published release."
            fi
            record_state \
              reconciled \
              "PR #${candidate_number} / ${tag} is explicitly marked ${RAN_RECONCILED_LABEL}, has no stale pending/tagged label, and has no conflicting published release."
            exit 0
          fi

          if [[ "$age_minutes" -lt "$RAN_GRACE_MINUTES" ]]; then
            record_state \
              pending \
              "PR #${candidate_number} / ${tag} is ${age_minutes} minutes old and remains inside the ${RAN_GRACE_MINUTES}-minute publication grace window."
            exit 0
          fi

          if [[ "$active_count" -gt 0 ]]; then
            record_state \
              pending \
              "PR #${candidate_number} / ${tag} is beyond the grace window, but release-capable exact-candidate automation is still active: ${active_names}."
            exit 0
          fi

          # Refresh the observable terminal picture immediately before declaring
          # the candidate stranded. Publication may have started after the
          # earlier release/run snapshots.
          final_runs="$(gh api --paginate "repos/${repository}/actions/runs?head_sha=${candidate_sha}&per_page=100" --slurp)"
          final_active_runs="$(jq -c --argjson current_run_id "$GITHUB_RUN_ID" --argjson workflow_names "$active_workflow_names" '[.[].workflow_runs[] | select(.id != $current_run_id and .status != "completed" and (.name as $name | ($workflow_names | index($name)) != null)) | {id, name, event, status, html_url}]' <<< "$final_runs")"
          final_active_count="$(jq -er 'length' <<< "$final_active_runs")"
          if [[ "$final_active_count" -gt 0 ]]; then
            final_active_names="$(jq -r '[.[] | "\(.name) (#\(.id), \(.status))"] | join(", ")' <<< "$final_active_runs")"
            record_state \
              pending \
              "PR #${candidate_number} / ${tag} is beyond the grace window, but release-capable exact-candidate automation became active during observation: ${final_active_names}."
            exit 0
          fi

          final_release_file="$(mktemp)"
          final_release_curl_status=0
          final_release_http_status="$(
            curl --silent --show-error \
              --output "$final_release_file" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${repository}/releases/tags/${tag}"
          )" || final_release_curl_status=$?
          if [[ "$final_release_curl_status" -ne 0 ]]; then
            rm -f "$final_release_file"
            fail_observer "Final published-release lookup failed at the transport layer with status ${final_release_curl_status}."
          fi

          final_tag_present=false
          final_tag_commit=''
          final_tag_file="$(mktemp)"
          final_tag_curl_status=0
          final_tag_http_status="$(
            curl --silent --show-error \
              --output "$final_tag_file" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${repository}/git/ref/tags/${tag}"
          )" || final_tag_curl_status=$?
          if [[ "$final_tag_curl_status" -ne 0 ]]; then
            rm -f "$final_release_file" "$final_tag_file"
            fail_observer "Final tag lookup failed at the transport layer with status ${final_tag_curl_status}."
          fi
          case "$final_tag_http_status" in
            200)
              final_tag_ref="$(cat "$final_tag_file")"
              rm -f "$final_tag_file"
              final_tag_commit="$(resolve_tag_commit "$final_tag_ref")"
              if [[ "$final_tag_commit" != "$candidate_sha" ]]; then
                rm -f "$final_release_file"
                fail_observer "Existing tag ${tag} resolves to ${final_tag_commit}, not exact candidate ${candidate_sha}."
              fi
              final_tag_present=true
              ;;
            404)
              rm -f "$final_tag_file"
              ;;
            *)
              cat "$final_tag_file" >&2
              rm -f "$final_release_file" "$final_tag_file"
              fail_observer "Final tag lookup for ${tag} failed with HTTP ${final_tag_http_status}."
              ;;
          esac

          final_candidate_labels="$(gh api "repos/${repository}/pulls/${candidate_number}" --jq '[.labels[].name]')"
          final_reconciled="$(jq -r --arg label "$RAN_RECONCILED_LABEL" 'index($label) != null' <<< "$final_candidate_labels")"
          final_pending="$(jq -r 'index("autorelease: pending") != null' <<< "$final_candidate_labels")"
          final_tagged="$(jq -r 'index("autorelease: tagged") != null' <<< "$final_candidate_labels")"

          case "$final_release_http_status" in
            200)
              final_release="$(cat "$final_release_file")"
              rm -f "$final_release_file"
              if ! jq -e \
                --arg tag "$tag" \
                '.tag_name == $tag and .draft == false and .published_at != null' \
                <<< "$final_release" >/dev/null; then
                fail_observer "Release ${tag} appeared during observation but is not a published non-draft release."
              fi
              if [[ "$final_tag_present" != true ]]; then
                fail_observer "Published release ${tag} appeared during observation without its final Git tag."
              fi
              if [[ "$final_reconciled" == true ]]; then
                fail_observer "Published release ${tag} also carries the unpublished reconciliation marker ${RAN_RECONCILED_LABEL}."
              fi
              if [[ "$final_tagged" == true && "$final_pending" != true ]]; then
                record_state \
                  published \
                  "PR #${candidate_number} / ${tag} became published at exact candidate ${candidate_sha} during the final liveness recheck."
              else
                record_state \
                  pending \
                  "PR #${candidate_number} / ${tag} became published at exact candidate ${candidate_sha} during observation; Release Please labels are still transitioning."
              fi
              exit 0
              ;;
            404)
              rm -f "$final_release_file"
              ;;
            *)
              cat "$final_release_file" >&2
              rm -f "$final_release_file"
              fail_observer "Final published-release lookup for ${tag} failed with HTTP ${final_release_http_status}."
              ;;
          esac

          settled_runs="$(gh api --paginate "repos/${repository}/actions/runs?head_sha=${candidate_sha}&per_page=100" --slurp)"
          settled_active_runs="$(jq -c --argjson current_run_id "$GITHUB_RUN_ID" --argjson workflow_names "$active_workflow_names" '[.[].workflow_runs[] | select(.id != $current_run_id and .status != "completed" and (.name as $name | ($workflow_names | index($name)) != null)) | {id, name, event, status, html_url}]' <<< "$settled_runs")"
          settled_active_count="$(jq -er 'length' <<< "$settled_active_runs")"
          if [[ "$settled_active_count" -gt 0 ]]; then
            settled_active_names="$(jq -r '[.[] | "\(.name) (#\(.id), \(.status))"] | join(", ")' <<< "$settled_active_runs")"
            record_state \
              pending \
              "PR #${candidate_number} / ${tag} is beyond the grace window, but release-capable exact-candidate automation became active during the final terminal-state reads: ${settled_active_names}."
            exit 0
          fi

          # A matching publisher can finish between the final release read and
          # the settled run snapshot. Re-read publication after observing a
          # stable no-active-run state before rejecting refreshed labels.
          settled_release_file="$(mktemp)"
          settled_release_curl_status=0
          settled_release_http_status="$(
            curl --silent --show-error \
              --output "$settled_release_file" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${repository}/releases/tags/${tag}"
          )" || settled_release_curl_status=$?
          if [[ "$settled_release_curl_status" -ne 0 ]]; then
            rm -f "$settled_release_file"
            fail_observer "Settled published-release lookup failed at the transport layer with status ${settled_release_curl_status}."
          fi
          case "$settled_release_http_status" in
            200)
              settled_release="$(cat "$settled_release_file")"
              rm -f "$settled_release_file"
              if ! jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .published_at != null' <<< "$settled_release" >/dev/null; then
                fail_observer "Release ${tag} appeared during settled observation but is not a published non-draft release."
              fi
              settled_tag_ref="$(gh api "repos/${repository}/git/ref/tags/${tag}")"
              settled_tag_commit="$(resolve_tag_commit "$settled_tag_ref")"
              if [[ "$settled_tag_commit" != "$candidate_sha" ]]; then
                fail_observer "Published tag ${tag} resolves to ${settled_tag_commit}, not exact candidate ${candidate_sha}."
              fi
              settled_labels="$(gh api "repos/${repository}/pulls/${candidate_number}" --jq '[.labels[].name]')"
              settled_reconciled="$(jq -r --arg label "$RAN_RECONCILED_LABEL" 'index($label) != null' <<< "$settled_labels")"
              settled_pending="$(jq -r 'index("autorelease: pending") != null' <<< "$settled_labels")"
              settled_tagged="$(jq -r 'index("autorelease: tagged") != null' <<< "$settled_labels")"
              if [[ "$settled_reconciled" == true ]]; then
                fail_observer "Published release ${tag} also carries the unpublished reconciliation marker ${RAN_RECONCILED_LABEL}."
              fi
              if [[ "$settled_tagged" == true && "$settled_pending" != true ]]; then
                record_state \
                  published \
                  "PR #${candidate_number} / ${tag} became published at exact candidate ${candidate_sha} during the settled liveness recheck."
              else
                record_state \
                  pending \
                  "PR #${candidate_number} / ${tag} became published at exact candidate ${candidate_sha}; Release Please labels are still transitioning."
              fi
              exit 0
              ;;
            404)
              rm -f "$settled_release_file"
              ;;
            *)
              cat "$settled_release_file" >&2
              rm -f "$settled_release_file"
              fail_observer "Settled published-release lookup for ${tag} failed with HTTP ${settled_release_http_status}."
              ;;
          esac

          settled_tag_present=false
          settled_tag_file="$(mktemp)"
          settled_tag_curl_status=0
          settled_tag_http_status="$(
            curl --silent --show-error \
              --output "$settled_tag_file" \
              --write-out '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${repository}/git/ref/tags/${tag}"
          )" || settled_tag_curl_status=$?
          if [[ "$settled_tag_curl_status" -ne 0 ]]; then
            rm -f "$settled_tag_file"
            fail_observer "Settled tag lookup failed at the transport layer with status ${settled_tag_curl_status}."
          fi
          case "$settled_tag_http_status" in
            200)
              settled_tag_ref="$(cat "$settled_tag_file")"
              rm -f "$settled_tag_file"
              settled_tag_commit="$(resolve_tag_commit "$settled_tag_ref")"
              if [[ "$settled_tag_commit" != "$candidate_sha" ]]; then
                fail_observer "Existing tag ${tag} resolves to ${settled_tag_commit}, not exact candidate ${candidate_sha}."
              fi
              settled_tag_present=true
              ;;
            404)
              rm -f "$settled_tag_file"
              ;;
            *)
              cat "$settled_tag_file" >&2
              rm -f "$settled_tag_file"
              fail_observer "Settled tag lookup for ${tag} failed with HTTP ${settled_tag_http_status}."
              ;;
          esac

          settled_labels="$(gh api "repos/${repository}/pulls/${candidate_number}" --jq '[.labels[].name]')"
          settled_reconciled="$(jq -r --arg label "$RAN_RECONCILED_LABEL" 'index($label) != null' <<< "$settled_labels")"
          settled_pending="$(jq -r 'index("autorelease: pending") != null' <<< "$settled_labels")"
          settled_tagged="$(jq -r 'index("autorelease: tagged") != null' <<< "$settled_labels")"

          if [[ "$settled_tagged" == true ]]; then
            fail_observer "PR #${candidate_number} is marked autorelease: tagged after the settled recheck, but no published release exists for ${tag}."
          fi

          if [[ "$settled_reconciled" == true ]]; then
            if [[ "$settled_pending" == true ]]; then
              fail_observer "PR #${candidate_number} is marked ${RAN_RECONCILED_LABEL} but still carries autorelease: pending."
            fi
            if [[ "$settled_tag_present" == true ]]; then
              fail_observer "PR #${candidate_number} is marked ${RAN_RECONCILED_LABEL}, but exact tag ${tag} exists without a published release."
            fi
            record_state \
              reconciled \
              "PR #${candidate_number} / ${tag} became explicitly marked ${RAN_RECONCILED_LABEL} during the settled liveness recheck."
            exit 0
          fi

          if [[ "$settled_tag_present" == true && "$tag_present" != true ]]; then
            record_state \
              pending \
              "PR #${candidate_number} / ${tag} gained its exact tag during observation; defer the terminal verdict to the next liveness check."
            exit 0
          fi

          {
            echo '## Release liveness: stranded'
            echo
            echo "Merged release PR #${candidate_number} / ${tag} has no exact published terminal state."
            echo
            echo "- candidate: ${candidate_sha}"
            echo "- merged: ${merged_at}"
            echo "- age: ${age_minutes} minutes"
            echo "- grace: ${RAN_GRACE_MINUTES} minutes"
            echo "- active release-capable exact-candidate runs: 0"
            echo "- reconciliation label: ${RAN_RECONCILED_LABEL} absent"
            echo
            echo 'Repository-specific recovery remains responsible for choosing whether to publish, repair, cancel, or supersede this candidate.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Release candidate ${tag} at ${candidate_sha} is stranded after ${age_minutes} minutes."
          exit 1
