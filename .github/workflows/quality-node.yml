name: RAN Node Quality

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the package file that declares the Node version.
        required: false
        type: string
        default: package.json
      pnpm-version:
        description: Exact pnpm version declared by packageManager and used for the locked toolchain.
        required: false
        type: string
        default: '11.13.1'
      working-directory:
        description: Project directory containing package.json and pnpm-lock.yaml.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  quality:
    name: RAN Node Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require locked Node manifests and exact package manager
        working-directory: ${{ inputs.working-directory }}
        env:
          RAN_PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          declared_pnpm="$(jq -er '.packageManager | select(startswith("pnpm@")) | ltrimstr("pnpm@") | split("+")[0]' package.json)"
          test "$declared_pnpm" = "$RAN_PNPM_VERSION"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Verify exact pnpm toolchain
        working-directory: ${{ inputs.working-directory }}
        env:
          RAN_PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: test "$(pnpm --version)" = "$RAN_PNPM_VERSION"

      - name: Install locked Node dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Run Node quality contract
        working-directory: ${{ inputs.working-directory }}
        run: pnpm check
