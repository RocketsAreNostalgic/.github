name: Profile A Contract

on:
  pull_request:
    paths:
      - '.github/workflows/release-profile-a.yml'
      - '.github/workflows/profile-a-contract.yml'
      - 'RELEASE_PROFILE_A.md'
      - 'quality-enforcement/test-release-profile-a.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-profile-a.yml'
      - '.github/workflows/profile-a-contract.yml'
      - 'RELEASE_PROFILE_A.md'
      - 'quality-enforcement/test-release-profile-a.mjs'

permissions:
  contents: read

jobs:
  contract:
    name: Profile A contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Profile A contract
        run: node quality-enforcement/test-release-profile-a.mjs
