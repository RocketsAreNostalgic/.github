name: Release Liveness Contract

on:
  pull_request:
    paths:
      - '.github/workflows/release-liveness-observer.yml'
      - '.github/workflows/release-liveness-contract.yml'
      - 'quality-enforcement/test-release-liveness-observer.py'
      - 'RELEASE_TRUST.md'
      - 'RELEASE_PUBLISHERS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-liveness-observer.yml'
      - '.github/workflows/release-liveness-contract.yml'
      - 'quality-enforcement/test-release-liveness-observer.py'
      - 'RELEASE_TRUST.md'
      - 'RELEASE_PUBLISHERS.md'

permissions:
  contents: read

jobs:
  contract:
    name: Release liveness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify read-only observer cases
        run: python3 quality-enforcement/test-release-liveness-observer.py
