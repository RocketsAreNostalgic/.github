name: RAN Required PHP Library Quality

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Verify protected PHP quality contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      php_floor: ${{ steps.contract.outputs.php_floor }}
      php_current: ${{ steps.contract.outputs.php_current }}
      php_extensions: ${{ steps.contract.outputs.php_extensions }}
      node_version: ${{ steps.contract.outputs.node_version }}
      working_directory: ${{ steps.contract.outputs.working_directory }}
    steps:
      - name: Require organisation-owned workflow identity
        env:
          RAN_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RAN_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          test "$RAN_WORKFLOW_REPOSITORY" = 'RocketsAreNostalgic/.github'
          test "$RAN_WORKFLOW_FILE_PATH" = '.github/workflows/required-quality-php-library.yml'

      - name: Check out exact target revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact target revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - name: Check out exact organisation policy source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ran-quality-policy
          persist-credentials: false

      - name: Verify centrally approved transitive contract
        id: contract
        env:
          RAN_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node .ran-quality-policy/quality-enforcement/validate-contract.mjs \
            --registry .ran-quality-policy/quality-enforcement/contracts.json \
            --repository "$RAN_REPOSITORY" \
            --worktree . \
            --expected-profile php-library

  baseline:
    name: Organisation PHP baseline
    needs: contract
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9
    with:
      php-floor: ${{ needs.contract.outputs.php_floor }}
      php-current: ${{ needs.contract.outputs.php_current }}
      php-extensions: ${{ needs.contract.outputs.php_extensions }}
      node-version: ${{ needs.contract.outputs.node_version }}
      working-directory: ${{ needs.contract.outputs.working_directory }}

  required-quality:
    name: required-quality
    if: ${{ always() }}
    needs:
      - contract
      - baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require protected contract and shared baseline
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success
          test "$BASELINE_RESULT" = success
