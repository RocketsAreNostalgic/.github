name: RAN WordPress Plugin Quality

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version used to execute the PHP quality contract.
        required: false
        type: string
        default: '8.4'
      node-version-file:
        description: Path to the package file that declares the Node version.
        required: false
        type: string
        default: package.json
      pnpm-version:
        description: Exact pnpm version declared by packageManager and used for the locked toolchain.
        required: false
        type: string
        default: '11.13.1'
      working-directory:
        description: Project directory containing Composer and pnpm manifests.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  quality:
    name: RAN WordPress Plugin Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject privileged pull_request_target callers
        if: ${{ github.event_name == 'pull_request_target' }}
        run: |
          echo 'RAN source-quality workflows do not execute pull-request head code from pull_request_target.' >&2
          exit 1

      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$RAN_EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"

      - name: Require locked project manifests and exact package manager
        working-directory: ${{ inputs.working-directory }}
        env:
          RAN_PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail
          test -f composer.json
          test -f composer.lock
          test -f package.json
          test -f pnpm-lock.yaml
          declared_pnpm="$(jq -er '.packageManager | select(startswith("pnpm@")) | ltrimstr("pnpm@") | split("+")[0]' package.json)"
          test "$declared_pnpm" = "$RAN_PNPM_VERSION"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        working-directory: ${{ inputs.working-directory }}
        run: composer validate --strict --no-check-publish --no-check-all

      - name: Install locked Composer dependencies
        working-directory: ${{ inputs.working-directory }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP quality contract
        working-directory: ${{ inputs.working-directory }}
        run: composer check

      - name: Lint all PHP files
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . \( -path './vendor' -o -path './node_modules' \) -prune -o -type f -name '*.php' -print0)

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Verify exact pnpm toolchain
        working-directory: ${{ inputs.working-directory }}
        env:
          RAN_PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: test "$(pnpm --version)" = "$RAN_PNPM_VERSION"

      - name: Install locked Node dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Run Node quality contract
        working-directory: ${{ inputs.working-directory }}
        run: pnpm check
