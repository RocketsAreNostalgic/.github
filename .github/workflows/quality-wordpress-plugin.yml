name: RAN WordPress Plugin Quality

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version used to execute the PHP quality contract.
        required: false
        type: string
        default: '8.4'
      node-version-file:
        description: Path to the package file that declares the Node version.
        required: false
        type: string
        default: package.json
      pnpm-version:
        description: pnpm version used to install and run the locked project toolchain.
        required: false
        type: string
        default: '11.13.1'
      working-directory:
        description: Project directory containing dependency manifests.
        required: false
        type: string
        default: .
      run-php:
        description: Install Composer dependencies and run the PHP quality contract.
        required: false
        type: boolean
        default: true
      run-node:
        description: Install pnpm dependencies and run the Node quality contract.
        required: false
        type: boolean
        default: true
      composer-install-args:
        description: Arguments passed to composer install after the command name.
        required: false
        type: string
        default: --no-interaction --prefer-dist
      php-check-command:
        description: Canonical deterministic PHP quality command.
        required: false
        type: string
        default: composer check
      node-check-command:
        description: Canonical deterministic Node quality command.
        required: false
        type: string
        default: pnpm check

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up PHP
        if: inputs.run-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install locked Composer dependencies
        if: inputs.run-php
        working-directory: ${{ inputs.working-directory }}
        run: composer install ${{ inputs.composer-install-args }}

      - name: Run PHP quality contract
        if: inputs.run-php
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.php-check-command }}

      - name: Set up pnpm
        if: inputs.run-node
        uses: pnpm/action-setup@v5.0.0
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        if: inputs.run-node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install locked Node dependencies
        if: inputs.run-node
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Run Node quality contract
        if: inputs.run-node
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.node-check-command }}
