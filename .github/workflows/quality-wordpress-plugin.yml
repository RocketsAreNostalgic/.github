name: RAN WordPress Plugin Quality

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version used to execute the PHP quality contract.
        required: false
        type: string
        default: '8.4'
      node-version-file:
        description: Path to the package file that declares the Node version.
        required: false
        type: string
        default: package.json
      pnpm-version:
        description: pnpm version used to install and run the locked project toolchain.
        required: false
        type: string
        default: '11.13.1'
      working-directory:
        description: Project directory containing Composer and pnpm manifests.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install locked Composer dependencies
        working-directory: ${{ inputs.working-directory }}
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP quality contract
        working-directory: ${{ inputs.working-directory }}
        run: composer check

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install locked Node dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Run Node quality contract
        working-directory: ${{ inputs.working-directory }}
        run: pnpm check
