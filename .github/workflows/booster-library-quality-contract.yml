name: Booster Library Quality Contract

on:
  pull_request:
    paths:
      - '.github/actions/booster-library-quality/**'
      - '.github/workflows/booster-library-quality-contract.yml'
      - 'quality-enforcement/test-booster-library-quality.mjs'
      - 'quality-enforcement/test-ci-quality-phase.mjs'
      - 'BOOSTER_LIBRARY_QUALITY.md'
  push:
    branches: [main]
    paths:
      - '.github/actions/booster-library-quality/**'
      - '.github/workflows/booster-library-quality-contract.yml'
      - 'quality-enforcement/test-booster-library-quality.mjs'
      - 'quality-enforcement/test-ci-quality-phase.mjs'
      - 'BOOSTER_LIBRARY_QUALITY.md'

permissions:
  contents: read

jobs:
  contract:
    name: Booster library recipe contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source
        env:
          RAN_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.11.0'
          check-latest: false
      - name: Verify recipe and phase controls
        run: |
          test "$(node --version)" = v24.11.0
          bash -n .github/actions/booster-library-quality/ci-quality-phase.sh
          node --test quality-enforcement/test-booster-library-quality.mjs quality-enforcement/test-ci-quality-phase.mjs
