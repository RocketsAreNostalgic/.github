name: Profile B Contract

on:
  pull_request:
    paths:
      - '.github/workflows/release-profile-b.yml'
      - '.github/workflows/profile-b-contract.yml'
      - 'RELEASE_PROFILE_B.md'
      - 'quality-enforcement/test-release-profile-b.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-profile-b.yml'
      - '.github/workflows/profile-b-contract.yml'
      - 'RELEASE_PROFILE_B.md'
      - 'quality-enforcement/test-release-profile-b.mjs'

permissions:
  contents: read

jobs:
  contract:
    name: Profile B contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Profile B contract
        run: node quality-enforcement/test-release-profile-b.mjs

      - name: Prove automatic token can read immutable-release enforcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$(gh api             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2026-03-10'             "repos/${GITHUB_REPOSITORY}/immutable-releases")"
          jq -e '.enabled == true' <<< "$settings" >/dev/null
